name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          GHOST_KEYSTORE_BASE64: ${{ secrets.GHOST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$GHOST_KEYSTORE_BASE64" ]; then
            echo "Missing GHOST_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          echo "$GHOST_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ghost.jks"

      - name: Test and build signed APK
        env:
          GHOST_KEYSTORE: ${{ runner.temp }}/ghost.jks
          GHOST_KEYSTORE_PASSWORD: ${{ secrets.GHOST_KEYSTORE_PASSWORD }}
          GHOST_KEY_ALIAS: ${{ secrets.GHOST_KEY_ALIAS }}
          GHOST_KEY_PASSWORD: ${{ secrets.GHOST_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "ghost-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk ghost.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ghost.apk
            ghost-${{ github.ref_name }}.apk
          generate_release_notes: true
